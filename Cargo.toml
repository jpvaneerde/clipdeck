[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/engine-wasm",
    "crates/model",
    "crates/samplegen",
    "crates/server",
    
    
    
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The WASM engine is built with this profile (see Dockerfile).
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
