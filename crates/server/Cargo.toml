[package]
name = "clipdeck-server"
description = "Clipdeck backend: serves the web app, the searchable sample library, projects and offline export."
version.workspace = true
edition.workspace = true

[[bin]]
name = "clipdeck-server"
path = "src/main.rs"

[dependencies]
clipdeck-engine = { path = "../engine" }
clipdeck-model = { path = "../model" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4", "adpcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
jsonwebtoken = "9.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
url = "2"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
axum = { version = "0.8", features = ["multipart", "form"] }
